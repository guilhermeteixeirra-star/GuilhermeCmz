<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF3F9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%232343C2%22/%3E%3Cpath d=%22M6 18l.9-3.6L15 6.3a1.6 1.6 0 0 1 2.3 2.3L9.2 16.7 6 18z%22 fill=%22none%22 stroke=%22%23FFE14D%22 stroke-width=%221.8%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Missão Redação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: uma coluna de caderno (até 760px). Barra de XP fixa em cima, um passo por tela, barra de ação fixa embaixo. */
:root{
  --paper:#EEF3F9; --sheet:#FFFFFF; --ink:#16213A; --ink-soft:#4B5875;
  --rule:#D2DCEB; --line:#CBD8EC; --margin:#D9434F;
  --pen:#2343C2; --pen-ink:#FFFFFF; --star:#C98A00;
  --marca:#FFE14D; --on-marca:#16213A;
  --ok:#17804F; --ok-bg:#E2F4EA; --warn:#B4400D; --warn-bg:#FCEADC;
  --hl0:#DFE6F2; --hl1:#FFE14D; --hl2:#FFC2D2; --hl3:#B6EBC5; --hl4:#B8DBFF; --hl5:#FFD19E; --hl-ink:#16213A;
  --scrim:rgb(14 21 36 / .55);
  --shadow:0 1px 2px rgb(22 33 58 / .06), 0 8px 24px rgb(22 33 58 / .08);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --f-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1524; --sheet:#162037; --ink:#E6EBF5; --ink-soft:#A7B2C9;
    --rule:#2C3858; --line:#2A3A5C; --margin:#EF6E77;
    --pen:#94ABFF; --pen-ink:#0E1524; --star:#F2C94C;
    --marca:#5E4D06; --on-marca:#FFF3C4;
    --ok:#62D394; --ok-bg:#12321F; --warn:#FFA06C; --warn-bg:#3B2416;
    --hl0:#26314C; --hl1:#5E4D06; --hl2:#672640; --hl3:#1D5233; --hl4:#1D446E; --hl5:#6A3D10; --hl-ink:#F3F6FC;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .35), 0 8px 24px rgb(0 0 0 / .3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1524; --sheet:#162037; --ink:#E6EBF5; --ink-soft:#A7B2C9;
  --rule:#2C3858; --line:#2A3A5C; --margin:#EF6E77;
  --pen:#94ABFF; --pen-ink:#0E1524; --star:#F2C94C;
  --marca:#5E4D06; --on-marca:#FFF3C4;
  --ok:#62D394; --ok-bg:#12321F; --warn:#FFA06C; --warn-bg:#3B2416;
  --hl0:#26314C; --hl1:#5E4D06; --hl2:#672640; --hl3:#1D5233; --hl4:#1D446E; --hl5:#6A3D10; --hl-ink:#F3F6FC;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 8px 24px rgb(0 0 0 / .3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button{font:inherit}
p{margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.5rem,10vw,3.8rem);line-height:.98}
h2{font-size:clamp(1.45rem,5.2vw,1.95rem);line-height:1.15}
h3{font-size:1.18rem;line-height:1.25}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.lead{font-size:1.12rem;color:var(--ink-soft);max-width:58ch}
.tip{color:var(--ink-soft);max-width:62ch}
.fine{font-size:.88rem;color:var(--ink-soft)}
.lbl{font-family:var(--f-hand);font-weight:700;font-size:1.15rem;color:var(--margin);line-height:1.2}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.tight{gap:8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

.mark{background-image:linear-gradient(var(--marca),var(--marca));background-repeat:no-repeat;background-size:100% 100%;color:var(--on-marca);border-radius:.16em;padding:0 .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mark.anim{animation:swipe .8s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes swipe{from{background-size:0% 100%}to{background-size:100% 100%}}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:6px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;background:none;border:0;color:var(--ink);padding:6px 0;cursor:pointer;min-height:44px}
.brand svg{color:var(--pen);flex:none}
.grow{flex:1}
.bagbtn{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer;font-variant-numeric:tabular-nums}
.xp{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;min-width:0}
.xp b{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xp b svg{color:var(--star)}
.xp small{font-size:.74rem;color:var(--ink-soft);white-space:nowrap}
.prog{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-bottom:8px}
.prog i{height:6px;border-radius:3px;background:var(--rule)}
.prog i.on{background:var(--pen)}
.prog i.now{background:var(--star)}
@media (max-width:400px){.brand span{display:none}}

main{padding-top:22px;padding-bottom:calc(var(--barh,0px) + 40px)}
.screen{display:flex;flex-direction:column;gap:22px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:999px;padding:.6em 1.2em;min-height:50px;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:.5em}
.btn.danger{border-color:var(--warn);color:var(--warn);background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ouvir{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-weight:700;font-size:.95rem;color:var(--pen);background:transparent;border:2px solid var(--pen);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer}
.ouvir.on{background:var(--pen);color:var(--pen-ink)}

/* início */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.proposta{background:var(--sheet);border:2px solid var(--ink);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.proposta .tema{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.25}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.in{font:inherit;font-weight:400;color:var(--ink);background:var(--sheet);border:2px solid var(--rule);border-radius:12px;padding:10px 14px;min-height:50px;width:100%}
.in:focus{border-color:var(--pen);outline:none}

.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trail li{position:relative}
.trail li:not(:last-child)::after{content:"";position:absolute;left:25px;top:60px;bottom:-8px;width:3px;background:var(--rule)}
.trail li.done:not(:last-child)::after{background:var(--pen)}
.station{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 0;color:var(--ink);cursor:pointer}
.station:disabled{cursor:not-allowed}
.dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;background:var(--sheet);border:3px solid var(--rule);color:var(--ink-soft);position:relative;z-index:1}
.station.done .dot{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.station.now .dot{background:var(--marca);border-color:var(--on-marca);color:var(--on-marca)}
.st-t{display:block;font-weight:700;font-size:1.05rem;line-height:1.3}
.st-s{display:block;font-size:.88rem;color:var(--ink-soft)}
.station.lock .st-t{color:var(--ink-soft)}
.pill{font-size:.8rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft)}
.station.now .pill{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.station.done .pill{color:var(--ok);border-color:var(--ok);background:transparent}

/* fase */
.fhead{display:flex;flex-direction:column;gap:8px}
.sdots{display:flex;gap:6px;flex-wrap:wrap}
.sdots i{width:22px;height:6px;border-radius:3px;background:var(--rule)}
.sdots i.on{background:var(--pen)}
.sdots i.now{background:var(--star)}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.cards.three{grid-template-columns:repeat(3,1fr)}}
.planta{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.planta li{display:flex;gap:12px;align-items:baseline;border-radius:10px;padding:12px 14px}
.planta li > b{font-family:var(--f-display);font-weight:800;min-width:2.6em;flex:none}
.planta li > div{display:flex;flex-direction:column;min-width:0}
.planta li strong{font-weight:700}
.exmini{background:var(--paper);border-radius:10px;padding:12px 14px}

/* perguntas */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;color:var(--ink);background:var(--sheet);border:2px solid var(--rule);border-radius:var(--r);padding:12px 14px;min-height:56px;cursor:pointer;line-height:1.4}
.opt .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid currentColor;font-weight:700;font-size:.9rem;margin-top:-2px}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.no{background:var(--warn-bg);border-color:var(--warn);color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:1px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{border-radius:12px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--warn-bg);color:var(--warn)}

/* cartas */
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.cartao{display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);background:var(--sheet);border:2px solid var(--rule);border-radius:var(--r);padding:16px;cursor:pointer;min-width:0}
.cartao:hover{border-color:var(--pen)}
.cartao.sel{background:var(--marca);color:var(--on-marca);border-color:var(--on-marca)}
.c-k{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.c-t{font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.2}
.c-d{font-size:.98rem;line-height:1.45}
.badge{align-self:flex-start;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--on-marca);color:var(--marca)}
.counter{font-weight:700;font-variant-numeric:tabular-nums}

/* leitura */
.seg{display:inline-flex;align-self:flex-start;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 16px;min-height:44px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.texto{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);font-size:1.05rem;line-height:1.75;min-width:0}
.texto .fonte{font-size:.8rem;line-height:1.4;color:var(--ink-soft);overflow-wrap:anywhere}
.texto .fonte a{color:inherit}
.gloss{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--pen);border-radius:4px}
.gloss.on{background:var(--marca);color:var(--on-marca)}
.facil{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px}
.dic{position:sticky;bottom:calc(var(--barh,0px) + 10px);z-index:2;background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}

/* escrita */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.95rem;font-weight:700;color:var(--pen);background:var(--sheet);border:2px dashed var(--pen);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer}
.chip:hover{border-style:solid}
.caderno{display:block;width:100%;font:inherit;font-size:1.05rem;line-height:2rem;color:var(--ink);min-height:calc(2rem * 5 + 14px);padding:6px 14px 6px 50px;border:2px solid var(--rule);border-radius:var(--r);resize:vertical;background-color:var(--sheet);background-image:linear-gradient(90deg,transparent 36px,var(--margin) 36px,var(--margin) 38px,transparent 38px),repeating-linear-gradient(180deg,transparent 0 calc(2rem - 1px),var(--line) calc(2rem - 1px) 2rem);background-attachment:local;background-position:0 0,0 6px}
.caderno:focus{border-color:var(--pen);outline:none}
.count{font-size:.92rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.count.ok{color:var(--ok)}
.aviso{font-size:.95rem;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px}
.obra{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.obra p{text-indent:1.5em;line-height:1.95;font-size:1.02rem}
.obra .ant{color:var(--ink-soft)}
.opt.sel{background:var(--marca);color:var(--on-marca);border-color:var(--on-marca)}
.opt.custom{border-style:dashed}
.chip.sel{background:var(--pen);color:var(--pen-ink);border-style:solid;border-color:var(--pen)}
.chip.no{border-color:var(--warn);color:var(--warn);text-decoration:line-through;cursor:default}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.exemplo{border:2px dashed var(--rule);border-radius:12px;padding:10px 14px}
.exemplo[open]{display:flex;flex-direction:column;gap:10px}
.exemplo summary{cursor:pointer;font-family:var(--f-hand);font-weight:700;font-size:1.15rem;color:var(--margin);min-height:34px;display:flex;align-items:center}

/* proposta de intervenção */
.frase-prop{background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;line-height:2.15;font-size:1.05rem}
.hl{border-radius:6px;padding:2px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.slot{border-bottom:2px dashed var(--ink-soft);color:var(--ink-soft);padding:0 4px;white-space:nowrap}
.grupo{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:10px}
.grupo legend{padding:0;margin-bottom:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.ops2{display:flex;flex-wrap:wrap;gap:8px}
.op2{color:var(--ink);background:var(--sheet);border:2px solid var(--rule);border-radius:12px;padding:8px 12px;min-height:44px;cursor:pointer;text-align:left;font-size:.98rem;line-height:1.35}
.op2.custom{border-style:dashed}
.op2.sel{border-color:currentColor;font-weight:700}

/* revisão */
.paragrafo{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;line-height:2.1;font-size:1.05rem;text-indent:1.5em;box-shadow:var(--shadow)}
.legenda{display:flex;flex-wrap:wrap;gap:8px}
.legenda span{font-size:.85rem;font-weight:700;border-radius:999px;padding:3px 10px}

/* recompensa */
.reward{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding-block:8px}
.reward h2{font-size:clamp(2.1rem,9vw,3.2rem);line-height:1.05}
.xpgain{font-size:1.15rem}
.newcards{display:grid;gap:10px;width:100%}
.rep{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rep b{font-family:var(--f-display);font-size:1.1rem}
.rep .frase{font-style:italic;color:var(--ink-soft)}
.rep.locked{border-style:dashed;background:transparent;color:var(--ink-soft)}

/* folha */
.folha{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding-block:14px 22px;overflow:hidden}
.folha-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:0 16px 10px 50px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.folha-h .t{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem}
.folha-h .n{font-size:.92rem;color:var(--ink-soft)}
.folha textarea{display:block;width:100%;border:0;resize:none;overflow:hidden;font:inherit;font-size:1.05rem;color:var(--ink);line-height:2rem;padding:0 16px 0 50px;text-indent:2em;background-color:transparent;background-image:linear-gradient(90deg,transparent 36px,var(--margin) 36px,var(--margin) 38px,transparent 38px),repeating-linear-gradient(180deg,transparent 0 calc(2rem - 1px),var(--line) calc(2rem - 1px) 2rem);background-attachment:local}
.folha textarea:focus{outline:none;background-color:var(--paper)}
.meter-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.meter-h b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.meter{position:relative;height:14px;border-radius:7px;background:var(--rule);margin-bottom:22px}
.meter > i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--ok)}
.meter > i.bad{background:var(--warn)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tick span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:700;white-space:nowrap;margin-top:3px}
.comps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.comps .comp:last-child{grid-column:1 / -1}
@media (min-width:640px){.comps{grid-template-columns:repeat(5,minmax(0,1fr))}.comps .comp:last-child{grid-column:auto}}
.comp{border:2px solid var(--warn);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--sheet);min-width:0}
.comp b{font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.comp .st{font-size:.85rem;font-weight:700;color:var(--warn)}
.comp.ok{border-color:var(--ok)}
.comp.ok .st{color:var(--ok)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.ic.ok{background:var(--ok);color:var(--sheet)}
.ic.no{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn)}

/* barra de ação */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--sheet);border-top:1px solid var(--rule);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.bar .hint{font-size:.9rem;color:var(--ink-soft);text-align:center}
@media (max-width:520px){
  .bar-in{grid-template-columns:auto 1fr}
  .bar .hint{grid-column:1 / -1;grid-row:1}
  .bar .hint:empty{display:none}
  .bar .next{justify-self:end}
}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-8px);z-index:30;background:var(--ink);color:var(--paper);font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.ov-panel{background:var(--paper);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding-top:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:12px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* salvamento e entrada */
.sync{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;min-width:0}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--ink-soft);flex:none}
.sync.ok{color:var(--ok)}
.sync.ok i{background:var(--ok)}
.sync.wait i{background:var(--star)}
.sync.off{color:var(--warn)}
.sync.off i{background:var(--warn)}
.pin{letter-spacing:.45em;font-variant-numeric:tabular-nums;font-size:1.35rem;max-width:11ch}
.erro{font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px}
.lembrete{background:var(--marca);color:var(--on-marca);border-radius:12px;padding:12px 14px}
.opt.usado{opacity:.55}
.aviso-c{font-size:.95rem;color:var(--warn);font-weight:700}

/* cores de marca-texto: por último, para valerem sobre os componentes */
.hl0{background:var(--hl0);color:var(--hl-ink)}
.hl1{background:var(--hl1);color:var(--hl-ink)}
.hl2{background:var(--hl2);color:var(--hl-ink)}
.hl3{background:var(--hl3);color:var(--hl-ink)}
.hl4{background:var(--hl4);color:var(--hl-ink)}
.hl5{background:var(--hl5);color:var(--hl-ink)}

const clone = o => JSON.parse(JSON.stringify(o));
function merge(b){
  const s = clone(DEFAULT);
  if(!b || typeof b !== 'object') return s;
  for(const k in s){
    if(b[k] === undefined) continue;
    if(s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) s[k] = Object.assign(s[k], b[k]);
    else s[k] = b[k];
  }
  if(!Array.isArray(s.paras) || s.paras.length !== 4) s.paras = ['','','',''];
  if(!Array.isArray(s.causas)) s.causas = [];
  return s;
}
/* ---------- sessão, cache no aparelho e salvamento na nuvem ---------- */
const lsGet = k => { try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };

let SESS = lsGet(SK);

const cache0 = SESS ? lsGet(cacheKey(SESS.id)) : null;
let S = merge(cache0 && cache0.S);
if(SESS){ S.nome = SESS.nome; S.turma = SESS.turma; }
let cacheMeta = {pendente: !!(cache0 && cache0.pendente), servidorEm: (cache0 && cache0.servidorEm) || 0};
let lastSent = '';            // estado (JSON) que o servidor já confirmou
let syncT = null, inflight = false, syncState = 'ok';
let LF = {nome:'', turma:''}; // formulário de entrada
let loginMsg = '', avisoSenha = '', sairAviso = false;

function snapshot(){ const c = clone(S); c.causasTmp = null; return c; }
function persistLocal(){ if(SESS) lsSet(cacheKey(SESS.id), {S: snapshot(), pendente: cacheMeta.pendente, servidorEm: cacheMeta.servidorEm}); }
function save(){
  if(!SESS) return;
  if(JSON.stringify(snapshot()) !== lastSent) cacheMeta.pendente = true;
  persistLocal();
  if(cacheMeta.pendente && !inflight) scheduleSync(2500);
  setSync();
}
let saveT; function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 300); }
function scheduleSync(ms){ clearTimeout(syncT); syncT = setTimeout(syncNow, ms); }
async function api(path, body){
  try{
    const r = await fetch(path, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
    let j = null; try{ j = await r.json(); }catch(e){}
    if(!j || typeof j !== 'object') j = {ok:false, erro:'servidor', msg:'O servidor não respondeu. Tente de novo daqui a pouco.'};
    j.status = r.status; return j;
  }catch(e){ return {ok:false, erro:'rede', msg:'Sem internet. Confira a conexão e tente de novo.'}; }
}
function etapaAtual(){ const fi = curFase(); return S.screen === 'folha' ? 'Folha de redação' : fi >= 0 ? `Fase ${fi+1} · ${FASES[fi].titulo}` : 'Trilha'; }
function payload(){
  return {token: SESS.token, estado: snapshot(), paras: S.paras.map(p => p || ''),
    resumo: {fases: FASES.filter(f => S.done[f.id]).length, xp: S.xp, nivel: levelName(S.xp), linhas: estLines(), etapa: etapaAtual()}};
}
async function syncNow(){
  clearTimeout(syncT);
  if(!SESS || !cacheMeta.pendente){ setSync(); return; }
  if(inflight){ scheduleSync(1200); return; }
  inflight = true; setSync('wait');
  const body = payload(), json = JSON.stringify(body.estado), sess = SESS;
  const r = await api('/api/salvar', body);
  inflight = false;
  if(SESS !== sess) return;
  if(r.ok){
    lastSent = json;
    cacheMeta.servidorEm = r.atualizadoEm || cacheMeta.servidorEm;
    if(JSON.stringify(snapshot()) === json) cacheMeta.pendente = false; else scheduleSync(1500);
    persistLocal(); setSync();
  } else if(r.erro === 'sessao') sessaoExpirou(r.msg);
  else { setSync('off'); scheduleSync(15000); }
}
function setSync(st){
  syncState = st || (cacheMeta.pendente ? (navigator.onLine === false ? 'off' : 'wait') : 'ok');
  const el = document.getElementById('sync'); if(!el) return;
  el.hidden = !SESS;
  el.className = 'sync ' + syncState;
  const t = document.getElementById('sync-t');
  if(t) t.textContent = syncState === 'ok' ? 'Salvo' : syncState === 'wait' ? 'Salvando…' : 'Sem internet';
  el.title = syncState === 'ok' ? 'Tudo salvo na nuvem' : syncState === 'wait' ? 'Salvando na nuvem…' : 'Sem internet: o progresso está guardado no celular e vai para a nuvem quando a internet voltar';
}
function flushBeacon(){
  if(!SESS || !cacheMeta.pendente) return;
  persistLocal();
  try{ if(navigator.sendBeacon) navigator.sendBeacon('/api/salvar', new Blob([JSON.stringify(payload())], {type:'text/plain'})); }catch(e){}
}
let refreshing = false;
async function refreshFromServer(){
  if(!SESS || refreshing) return;
  refreshing = true;
  const sess = SESS, r = await api('/api/estado', {token: SESS.token});
  refreshing = false;
  if(SESS !== sess) return;
  if(r.ok){
    if(cacheMeta.pendente){ syncNow(); return; }
    if(r.estado && (r.atualizadoEm || 0) > cacheMeta.servidorEm && !inflight) adoptState(r.estado, r.atualizadoEm || 0);
    else setSync();
  } else if(r.erro === 'sessao') sessaoExpirou(r.msg);
  else setSync(cacheMeta.pendente ? 'off' : undefined);
}
function adoptState(estado, t){
  const scr = S.screen;
  S = merge(estado); S.nome = SESS.nome; S.turma = SESS.turma;
  if(scr === 'home') S.screen = 'home';
  lastSent = JSON.stringify(snapshot());
  cacheMeta = {pendente:false, servidorEm: t};
  persistLocal(); render();
}
function sessaoExpirou(msg){
  if(SESS){ persistLocal(); LF = {nome: SESS.nome, turma: SESS.turma}; }
  SESS = null; lsDel(SK);
  loginMsg = msg || 'Entre de novo com seu nome, turma e senha.';
  S = merge(null); go();
}
async function entrar(){
  const nome = (($('#in-nome') || {}).value || '').trim(), turma = (($('#in-turma') || {}).value || '').trim(), pin = (($('#in-pin') || {}).value || '').trim();
  LF = {nome, turma};
  const palavras = nome.split(/\s+/).filter(w => /[A-Za-zÀ-ÿ]/.test(w));
  if(palavras.length < 2) return loginErro('Escreva seu nome e sobrenome.');
  if(!turma) return loginErro('Escreva a sua turma. Exemplo: 2º B.');
  if(!/^\d{4}$/.test(pin)) return loginErro('A senha tem que ter 4 números.');
  const b = $('#btn-entrar'); if(b){ b.disabled = true; b.textContent = 'Entrando…'; }
  const r = await api('/api/entrar', {nome, turma, pin});
  if(!r.ok) return loginErro(r.msg || 'Não deu para entrar. Tente de novo.');
  SESS = {token: r.token, id: r.aluno.id, nome: r.aluno.nome, turma: r.aluno.turma};
  lsSet(SK, SESS);
  const c = lsGet(cacheKey(SESS.id));
  if(c && c.pendente && c.S){ S = merge(c.S); cacheMeta = {pendente:true, servidorEm: r.atualizadoEm || 0}; lastSent = ''; }
  else { S = merge(r.estado || null); cacheMeta = {pendente:false, servidorEm: r.atualizadoEm || 0}; S.nome = SESS.nome; S.turma = SESS.turma; lastSent = JSON.stringify(snapshot()); }
  S.nome = SESS.nome; S.turma = SESS.turma; S.screen = 'home';
  loginMsg = ''; avisoSenha = (r.novo || r.senhaNova) ? pin : '';
  go();
  if(cacheMeta.pendente) syncNow();
}
function loginErro(m){ loginMsg = m; render(); const e = $('.erro'); if(e) e.scrollIntoView({block:'center'}); }
async function sair(forcar){
  if(!SESS) return;
  if(!forcar && cacheMeta.pendente){
    for(let i = 0; i < 40 && inflight; i++) await new Promise(r => setTimeout(r, 200));
    await syncNow();
    if(cacheMeta.pendente){ sairAviso = true; render(); return; }
  }
  if(!cacheMeta.pendente) lsDel(cacheKey(SESS.id));
  SESS = null; lsDel(SK);
  sairAviso = false; avisoSenha = ''; loginMsg = ''; LF = {nome:'', turma:''};
  cacheMeta = {pendente:false, servidorEm:0}; lastSent = '';
  S = merge(null); go();
}

/* ---------- voz ---------- */
const canSpeak = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
let speakingBtn = null;
function stopSpeak(){
  if(canSpeak){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(speakingBtn){ speakingBtn.classList.remove('on'); speakingBtn = null; }
}
function speakText(btn, txt){
  if(!canSpeak) return;
  if(speakingBtn === btn){ stopSpeak(); return; }
  stopSpeak();
  txt = (txt || '').replace(/\s+/g,' ').trim();
  if(!txt) return;
  try{
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'pt-BR'; u.rate = .92;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /pt[-_]BR/i.test(x.lang)) || vs.find(x => /^pt/i.test(x.lang));
    if(v) u.voice = v;
    u.onend = u.onerror = () => { if(speakingBtn === btn){ btn.classList.remove('on'); speakingBtn = null; } };
    speakingBtn = btn; btn.classList.add('on');
    speechSynthesis.speak(u);
  }catch(e){ speakingBtn = null; btn.classList.remove('on'); toast('Não deu para ler em voz alta neste aparelho.'); }
}
const speakBtn = t => canSpeak ? `<button class="ouvir" data-act="speak" data-t="${t}">${ICON.speak}<span>Ouvir</span></button>` : '';

/* ---------- proposta de intervenção ---------- */
function propVal(g){
  const k = S.prop[g];
  if(k === null || k === undefined) return '';
  if(k === -1) return (S.prop['c_'+g] || '').trim().replace(/[.,;:]+$/,'');
  const L = {agente:AGENTES,acao:ACOES,meio:MEIOS,fim:FINS}[g];
  const it = L[k]; if(!it) return '';
  return typeof it === 'string' ? it : it.t;
}
function verbo(){
  const k = S.prop.agente;
  if(typeof k === 'number' && k >= 0 && AGENTES[k]) return AGENTES[k].v;
  return /^(os|as)\s/i.test(propVal('agente')) ? 'devem' : 'deve';
}
const acaoSel = () => { const k = S.prop.acao; return (typeof k === 'number' && k >= 0) ? ACOES[k] : null; };
function propSentence(){
  const a = propVal('agente'), b = propVal('acao'), c = propVal('meio'), d = propVal('fim');
  if(!(a && b && c && d)) return '';
  return `Para isso, ${a} ${verbo()} ${b}, ${c}, ${d}.`;
}
function propPreviewHTML(){
  const slot = (g, cls, ph) => { const v = propVal(g); return v ? `<span class="hl ${cls}">${esc(v)}</span>` : `<span class="slot">${ph}</span>`; };
  return `Para isso, ${slot('agente','hl1','quem?')} ${verbo()} ${slot('acao','hl2','fazer o quê?')}, ${slot('meio','hl3','como?')}, ${slot('fim','hl4','para quê?')}.`;
}

const mOf = id => S.m[id] || (S.m[id] = {c:null,ct:[],o:null,txt:''});
function conOk(id){

}
const LOWER_START = /^(O|A|Os|As|Um|Uma|Uns|Umas|Eles|Elas|Isso|Esse|Essa|Esses|Essas|Muitos|Muitas|Muito|Muita|Quem|Hoje|Na|No|Nas|Nos|Em|De|Para|Com|Por|Sem|Se|Quando|Mais|Ainda|Todo|Toda|Todos|Todas)\b/;
function blockBody(id){
  const d = blockDef(id), m = S.m[id];
  if(!m || m.o == null) return '';
  if(m.o === -1) return (m.txt || '').replace(/\s+/g,' ').trim();
  return d.opts[m.o] != null ? optText(d.opts[m.o]) : '';
}
function blockText(id){
  const d = blockDef(id);
  let body = blockBody(id);
  if(!body || !conOk(id)) return '';
  if(!d.cons) return fix(body);
  if(LOWER_START.test(body)) body = body.charAt(0).toLowerCase() + body.slice(1);
  return fix(d.cons[S.m[id].c].t + ' ' + body);
}
function usedReps(exceptId){
  const u = new Set();
  if(S.abertura) u.add(S.abertura);
  const pm = S.m.intro_ponte;
  if(pm && pm.o === 1 && abertura().tipo === 'contraste') u.add('r53');
  ['d1_prova','d2_prova'].forEach(b => {
    if(b === exceptId) return;
    const m = S.m[b]; if(!m || m.o == null || m.o < 0) return;
    const o = blockDef(b).opts[m.o]; if(Array.isArray(o)) u.add(o[0]);
  });
  return u;
}
const repUsada = (id, o) => Array.isArray(o) && usedReps(id).has(o[0]);
function blockOk(id){
  const m = S.m[id];
  if(!conOk(id) || !m || m.o == null) return false;
  if(m.o === -1) return words(m.txt) >= 3;
  const o = blockDef(id).opts[m.o];
  return o != null && !repUsada(id, o);
}

      ${speakBtn('opts-w')}
      <div class="opts" id="opts-w">${d.opts.map((o,k) => { const usada = repUsada(id, o); return `<button class="opt ${m.o === k ? 'sel' : ''} ${usada ? 'usado' : ''}" data-act="opt" data-k="${k}" aria-pressed="${m.o === k}" ${usada ? 'disabled' : ''}><span class="k">${'ABCDE'[k]}</span><span>${usada ? '<span class="tag hl0">Já está em outro parágrafo</span>' : Array.isArray(o) ? `<span class="tag hl4">${REP[o[0]].tipo}</span>` : ''}${esc(optText(o))}</span></button>`; }).join('')}
        <button class="opt custom ${m.o === -1 ? 'sel' : ''}" data-act="opt" data-k="-1" aria-pressed="${m.o === -1}"><span class="k">${ICON.penSm}</span><span>Quero escrever do meu jeito</span></button></div>
      ${m.o === -1 ? `<label class="sr" for="mc-${id}">Escreva do seu jeito</label><textarea id="mc-${id}" class="caderno" data-mc="${id}" rows="3" placeholder="${d.cons ? 'Continue a frase depois de “' + esc(d.cons[m.c].t.replace(/,$/,'')) + '”…' : 'Escreva a sua frase aqui…'}">${esc(m.txt)}</textarea><p class="aviso" id="aviso" hidden></p>` : ''}
    </div>`;
  return `
  <div class="stack"><p class="eyebrow">${d.n}</p><h2>${d.q}</h2><p class="tip" id="tip-w">${d.tip}</p>${speakBtn('tip-w')}</div>
  <div class="obra"><span class="lbl">Sua redação · ${ORD[pi]} parágrafo</span><p>${prev ? `<span class="ant">${esc(prev)}</span> ` : ''}<span class="mark" id="cur">${partial}</span></p></div>

function faseHTML(fi){
  const f = FASES[fi], i = Math.min(S.step[f.id] || 0, f.steps.length - 1), st = f.steps[i];
  const head = `<div class="fhead"><p class="eyebrow">Fase ${fi+1} de ${FASES.length} · ${f.titulo}</p>
    <div class="sdots" role="img" aria-label="Passo ${i+1} de ${f.steps.length}">${f.steps.map((_,k) => `<i class="${k < i ? 'on' : k === i ? 'now' : ''}"></i>`).join('')}</div></div>`;
  let body = '';
  switch(st.t){
    case 'proposta': body = propostaHTML(); break;
    case 'info': body = infoHTML(st.k); break;
    case 'quiz': body = quizHTML(st.q); break;
    case 'read': body = readHTML(); break;
    case 'causas': body = causasHTML(); break;
    case 'abertura': body = aberturaHTML(); break;
    case 'monte': body = monteHTML(st); break;
    case 'proposal': body = proposalHTML(); break;
    case 'review': body = reviewHTML(st, fi); break;
    case 'reward': body = rewardHTML(fi); break;
  }
  return head + body;
}

function stepValid(st){
  if(!st) return true;
  switch(st.t){
    case 'quiz': return !!(S.quiz[st.q] && S.quiz[st.q].ok);
    case 'causas': return (Array.isArray(S.causasTmp) ? S.causasTmp : S.causas).length === 2;
    case 'abertura': return !!S.abertura;
    case 'monte': return blockOk(st.id);
    case 'proposal': return ['agente','acao','meio','fim'].every(g => propVal(g));
    default: return true;
  }
}
function stepHint(st){
  switch(st.t){
    case 'quiz': return 'Acerte a resposta para continuar.';
    case 'causas': return `Escolha 2 motivos (${(Array.isArray(S.causasTmp) ? S.causasTmp : S.causas).length} de 2).`;
    case 'abertura': return 'Escolha um repertório.';
    case 'monte': { const m = S.m[st.id]; return !conOk(st.id) ? 'Escolha a palavra de ligação certa.' : (!m || m.o == null) ? 'Escolha uma frase.' : m.o === -1 ? 'Escreva pelo menos 3 palavras.' : 'Essa prova já está em outro parágrafo. Escolha outra.'; }
    case 'proposal': return 'Responda às 4 perguntas.';
    default: return '';
  }
}
function faseBar(fi){
  const f = FASES[fi], i = Math.min(S.step[f.id] || 0, f.steps.length - 1), st = f.steps[i];
  const ok = stepValid(st);
  let label = 'Continuar';
  if(st.t === 'review') label = 'Concluir fase';
  if(st.t === 'reward'){ const nf = FASES[fi+1]; label = !nf ? 'Ver minha redação' : !S.done[nf.id] ? 'Próxima fase' : FASES.every(x => S.done[x.id]) ? 'Ver minha redação' : 'Voltar para a trilha'; }
  return `<button class="btn ghost" data-act="back">${ICON.left}${st.t === 'reward' ? 'Trilha' : 'Voltar'}</button>
    <p class="hint" id="hint">${ok ? '' : stepHint(st)}</p>
    <button class="btn primary next" id="next" data-act="next" ${ok ? '' : 'disabled'}>${label}${ICON.right}</button>`;
}
function updateBar(){
  const st = curStep(); if(!st) return;
  const ok = stepValid(st);
  const n = $('#next'); if(n) n.disabled = !ok;
  const h = $('#hint'); if(h) h.textContent = ok ? '' : stepHint(st);
  setBarH();
}

/* ---------- folha ---------- */
function checks(){
  const ps = S.paras.map(p => (p || '').trim()), all = ps.join(' '), low = all.toLowerCase(), lines = estLines();
  const con = CONECTIVOS.filter(c => low.includes(c)).map(c => c.replace(/,$/,''));
  const ab = (all.match(ABREV) || []).map(x => x.toLowerCase());
  const acho = /\beu acho\b/i.test(all);
  return [
    {id:'paras',ok:ps.every(Boolean),t:'Tem 4 parágrafos',d:'Introdução, 2 argumentos e conclusão.'},
    {id:'tam',ok:lines >= 8 && lines <= 30,t:'Tamanho certo',d:lines < 8 ? 'Está curto. No ENEM, redação com 7 linhas ou menos vale zero.' : lines > 30 ? 'Passou de 30 linhas. Corte o que estiver repetido.' : `Cerca de ${lines} linhas. O ENEM aceita de 8 a 30.`},
    {id:'tema',ok:/leitor|leitura|\bler\b|livro/i.test(ps[0] || ''),t:'A introdução fala do tema',d:'Use as palavras “leitura” ou “leitores” já no 1º parágrafo.'},
    {id:'rep',ok:REPRX.test(all),t:'Usa repertório',d:'Um dado, uma lei ou uma frase famosa.'},
    {id:'arg',ok:!!(ps[1] && ps[2]),t:'Tem 2 argumentos',d:'Um motivo em cada parágrafo do meio.'},
    {id:'con',ok:con.length >= 4,t:'Usa palavras de ligação',d:`Você usou ${con.length}${con.length ? ': ' + con.slice(0,6).join(', ') : ''}. Use pelo menos 4 diferentes.`},
    {id:'prop',ok:!!(propSentence() && blockText('c_detalhe') && ps[3]),t:'Solução com 5 elementos',d:'Quem, o quê, como, para quê e um detalhe.'},
    {id:'formal',ok:!ab.length && !acho,t:'Linguagem formal',d:ab.length ? `Troque as abreviações: ${[...new Set(ab)].join(', ')}.` : acho ? 'Tire o “eu acho”.' : 'Sem abreviações de internet e sem “eu acho”.'}
  ];
}

  const comps = [['C1','Escrita formal',by('formal')],['C2','Tema e repertório',by('tema') && by('rep')],['C3','Argumentos',by('paras') && by('arg')],['C4','Palavras de ligação',by('con')],['C5','Solução',by('prop')]];
  return `
  <h3>Confira antes de entregar</h3>
  <p class="tip">O ENEM corrige 5 competências, e cada uma vale até 200 pontos. Isto não é a sua nota: é uma lista para você revisar.</p>
  <div class="comps">${comps.map(([c,t,ok]) => `<div class="comp ${ok ? 'ok' : ''}"><b>${c}</b><span>${t}</span><span class="st">${ok ? 'Tudo certo' : 'Revisar'}</span></div>`).join('')}</div>
  <ul class="checks">${ch.map(x => `<li><span class="ic ${x.ok ? 'ok' : 'no'}" aria-hidden="true">${x.ok ? ICON.checkSm : '!'}</span><span><b>${x.t}</b><br><span class="fine">${esc(x.d)}</span></span></li>`).join('')}</ul>
  <h3>Revise você mesmo</h3>
  <div class="opts">${REVS.map(([k,t]) => `<button class="opt ${S.rev[k] ? 'ok' : ''}" data-act="rev" data-r="${k}" aria-pressed="${!!S.rev[k]}"><span class="k">${S.rev[k] ? ICON.checkSm : ''}</span><span>${t}</span></button>`).join('')}</div>`;
}
function meterHTML(l){
  const max = 34, pct = v => Math.min(100, v / max * 100), bad = l < 8 || l > 30;
  return `<div class="meter-h"><b>≈ ${l} linhas</b><span class="fine">Conta aproximada, como se fosse escrito à mão. No ENEM: de 8 a 30 linhas.</span></div>
  <div class="meter" role="img" aria-label="Cerca de ${l} linhas"><i class="${bad ? 'bad' : ''}" style="width:${pct(l)}%"></i>
    <span class="tick" style="left:${pct(8)}%"><span>8</span></span><span class="tick" style="left:${pct(30)}%"><span>30</span></span></div>`;
}
function folhaHTML(){
  const all = FASES.every(f => S.done[f.id]);
  return `
  <div class="stack"><p class="eyebrow">${all ? 'Missão cumprida' : 'Folha de redação'}</p><h2>Sua redação está aqui</h2>

  <div class="folha">

    ${S.paras.map((p,i) => `<label class="sr" for="fp-${i}">${PARA_NOME[i]}</label><textarea id="fp-${i}" data-folha="${i}" rows="2" placeholder="${PARA_NOME[i]}: conclua a fase para preencher.">${esc(p)}</textarea>`).join('')}

    <p class="fine">Se o professor pedir, toque em <b>Copiar redação</b> e cole onde ele indicar (por exemplo, no Google Sala de Aula).</p>
    <p class="fine">No ENEM de verdade, não escreva o seu nome no texto: redação assinada vale zero. Aqui o nome aparece só para o professor saber de quem é.</p>
    <div id="copybox" class="stack tight" hidden><label for="copy-ta" class="tip">Não deu para copiar sozinho. Selecione todo o texto abaixo e copie:</label><textarea id="copy-ta" class="in" rows="8" readonly></textarea></div>
  </div>
  <div class="row"><button class="btn danger" data-act="reset">Apagar tudo e recomeçar</button></div>
  <div id="resetbox" class="card" hidden><p><b>Tem certeza?</b> Isso apaga a sua redação e os seus pontos neste aparelho.</p>
    <div class="row"><button class="btn danger" data-act="reset-yes">Sim, apagar</button><button class="btn" data-act="reset-no">Não, manter</button></div></div>`;
}
function refreshChecks(){
  const c = $('#checks'); if(c) c.innerHTML = checksHTML(checks());
  const m = $('#medidor'); if(m) m.innerHTML = meterHTML(estLines());
}
function grow(ta){ ta.style.height = 'auto'; const lh = 32; ta.style.height = Math.max(lh * 2, Math.ceil(ta.scrollHeight / lh) * lh) + 'px'; }
function fullText(){
  const head = [`Nome: ${SESS ? SESS.nome : S.nome}`, (SESS ? SESS.turma : S.turma) ? `Turma: ${SESS ? SESS.turma : S.turma}` : null, `Tema: ${TEMA}`].filter(Boolean).join('\n');
  return head + '\n\n' + S.paras.map(p => (p || '').trim()).filter(Boolean).join('\n\n');
}
function copyAll(){
  const txt = fullText();
  const fallback = () => {
    const box = $('#copybox'), ta = $('#copy-ta');
    if(!box || !ta) return;
    box.hidden = false; ta.value = txt; ta.focus(); ta.select();
    toast('Selecione o texto e copie.');
  };
  try{
    if(!navigator.clipboard || !navigator.clipboard.writeText) return fallback();
    navigator.clipboard.writeText(txt).then(() => toast('Redação copiada! Agora cole onde o professor pediu.'), fallback);
  }catch(e){ fallback(); }
}

/* ---------- render ---------- */
function renderTop(){
  $('#xp-n').textContent = S.xp;
  $('#xp-l').textContent = levelName(S.xp);
  $('#bag-n').textContent = `${REP_ORDER.filter(r => S.rep[r]).length}/${REP_ORDER.length}`;
  $('#prog').innerHTML = FASES.map(f => `<i class="${S.done[f.id] ? 'on' : f.id === S.screen ? 'now' : ''}"></i>`).join('');
}
function setBarH(){
  const b = $('#bar');
  document.documentElement.style.setProperty('--barh', (b.hidden ? 0 : b.offsetHeight) + 'px');
}
function integridade(){
  if(S.done.causas && (S.causas.length !== 2 || S.causas[0] === S.causas[1])) S.done.causas = false;
  FASES.forEach(f => {
    if(!S.done[f.id]) return;
    const ok = f.steps.every(st => st.t === 'causas' ? S.causas.length === 2 : stepValid(st));
    if(!ok){ S.done[f.id] = false; if((S.step[f.id] || 0) >= f.steps.length - 1) S.step[f.id] = 0; }
  });
  FASES.forEach(f => {
    if(typeof f.para !== 'number' || S.edited[f.para]) return;
    S.paras[f.para] = S.done[f.id] ? compose(f.para) : '';
  });
}
function render(){
  stopSpeak();
  let html = '', bar = null;
  if(!SESS) S.screen = 'entrar';
  else {
    integridade();
    const st = curStep();
    if(!(st && st.t === 'causas')) S.causasTmp = null;
    if(S.screen === 'entrar') S.screen = 'home';
  }
  if(S.screen === 'folha' && !S.done.concl) S.screen = 'home';
  if(!['home','folha','entrar'].includes(S.screen) && curFase() < 0) S.screen = 'home';
  if(S.screen === 'entrar') html = entrarHTML();
  else if(S.screen === 'home') html = homeHTML();
  else if(S.screen === 'folha'){
    html = folhaHTML();
    bar = `<button class="btn ghost" data-act="home">${ICON.left}Trilha</button><p class="hint"></p><button class="btn primary next" data-act="copy">${ICON.copy}Copiar redação</button>`;
  } else {
    const fi = curFase();
    html = faseHTML(fi); bar = faseBar(fi);
  }
  renderTop();
  $('#screen').innerHTML = html;
  const barEl = $('#bar');
  if(bar){ $('#bar-in').innerHTML = bar; barEl.hidden = false; } else { barEl.hidden = true; $('#bar-in').innerHTML = ''; }
  setBarH();
  const ta = document.querySelector('textarea[data-mc]');
  if(ta) updateAviso(ta.value);
  document.querySelectorAll('textarea[data-folha]').forEach(grow);
  save();
}
function go(){ render(); window.scrollTo(0, 0); }

function pickCon(k){
  const st = curStep(); if(!st || st.t !== 'monte') return;
  const d = blockDef(st.id), m = mOf(st.id), c = d.cons && d.cons[k];
  if(!c) return;
  if(!Array.isArray(m.ct)) m.ct = [];
  if(!m.ct.includes(k)) m.ct.push(k);
  if(c.ok){ m.c = k; award(`c:${S.screen}:${st.id}`, m.ct.some(i => !d.cons[i].ok) ? 2 : 5); }
  render();
  if(!c.ok){ const b = document.querySelector(`[data-act="con"][data-k="${k}"]`); if(b) b.classList.add('shake'); }
  else { const o = $('#opts-w'); if(o) o.scrollIntoView({block:'nearest'}); }
}
function pickOpt(k){
  const st = curStep(); if(!st || st.t !== 'monte') return;
  const m = mOf(st.id), first = m.o == null;
  m.o = k; render();
  if(k === -1){ const t = document.querySelector('textarea[data-mc]'); if(t) t.focus(); }
  else if(first) toast('Frase colocada na sua redação!');
}

/* ---------- ações ---------- */
function openTarget(f){
  if(!SESS) return;
  avisoSenha = ''; sairAviso = false;
  if(f === 'folha'){ if(!S.done.concl) return; S.screen = 'folha'; return go(); }
  const i = FASES.findIndex(x => x.id === f);
  if(i < 0 || !(S.done[f] || available(i))) return;
  const last = FASES[i].steps.length - 1;
  if(S.done[f] && (S.step[f] || 0) >= last) S.step[f] = 0;
  S.screen = f; go();
}
function concluir(fi){
  const f = FASES[fi], before = levelIdx(S.xp), xp0 = S.xp;
  f.steps.forEach(s => { if(s.t === 'monte') award(`b:${f.id}:${s.id}`, 5, true); if(s.t === 'proposal') award(`b:${f.id}:prop`, 5, true); });
  award(`f:${f.id}`, 20, true);
  (f.unlock || []).forEach(r => { S.rep[r] = true; });
  if(typeof f.para === 'number'){ S.paras[f.para] = compose(f.para); S.edited[f.para] = false; }
  S.done[f.id] = true;
  S.lvl[f.id] = {up: levelIdx(S.xp) > before};
  S.ganho[f.id] = {xp: S.xp - xp0};
}
function trocarMotivos(novos){
  const mudou = JSON.stringify(novos) !== JSON.stringify(S.causas);
  S.causas = novos.slice(); S.causasTmp = null;
  if(!mudou) return;
  ['intro_tese','d1_topico','d1_explica','d1_prova','d1_fecha','d2_topico','d2_explica','d2_prova','d2_fecha','c_retomada'].forEach(k => { delete S.m[k]; });
  const algum = ['intro','d1','d2','concl'].some(k => S.done[k]);
  ['intro','d1','d2','concl'].forEach(k => { S.done[k] = false; S.step[k] = 0; });
  S.paras = ['','','','']; S.edited = {};
  if(algum) toast('Motivos trocados. Refaça as fases 4 a 7.');
}
function next(){
  const fi = curFase(); if(fi < 0) return;
  const f = FASES[fi], i = Math.min(S.step[f.id] || 0, f.steps.length - 1), st = f.steps[i];
  if(!stepValid(st)) return;
  if(st.t === 'reward'){
    const nf = FASES[fi+1];
    if(!nf) S.screen = 'folha';
    else if(!S.done[nf.id]) S.screen = nf.id;
    else S.screen = FASES.every(x => S.done[x.id]) ? 'folha' : 'home';
    return go();
  }
  if(st.t === 'causas' && Array.isArray(S.causasTmp)) trocarMotivos(S.causasTmp);
  const conclui = f.steps[i+1] && f.steps[i+1].t === 'reward';
  if(conclui) concluir(fi);
  S.step[f.id] = i + 1; go();
  if(conclui) syncNow();
}
function back(){
  const fi = curFase();
  if(fi < 0){ S.screen = 'home'; return go(); }
  const f = FASES[fi], i = Math.min(S.step[f.id] || 0, f.steps.length - 1);
  if(i === 0 || f.steps[i].t === 'reward'){ S.screen = 'home'; return go(); }
  S.step[f.id] = i - 1; go();
}
function answer(qid, k){
  const q = QUIZ[qid], st = S.quiz[qid] || {tries:0,ok:false,picks:[]};
  if(st.ok || st.picks.includes(k)) return;
  st.tries++; st.picks.push(k);
  S.quiz[qid] = st;
  if(k === q.c){ st.ok = true; award(`q:${S.screen}:${qid}`, st.tries === 1 ? 10 : 5); }
  render();
  if(!st.ok){ const b = document.querySelector(`[data-act="ans"][data-k="${k}"]`); if(b) b.classList.add('shake'); }
  const fb = $('#fb'); if(fb) fb.scrollIntoView({block:'nearest'});
}
function toggleCausa(id){
  if(!Array.isArray(S.causasTmp)) S.causasTmp = S.causas.slice();
  const sel = S.causasTmp, i = sel.indexOf(id);
  if(i >= 0) sel.splice(i, 1);
  else if(sel.length < 2) sel.push(id);
  else { toast('Você já tem 2. Toque em um escolhido para trocar.'); return; }
  render();
}
function showGloss(b){
  document.querySelectorAll('.gloss.on').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  const g = GLOSS[b.dataset.g], d = $('#dic');
  if(g && d) d.innerHTML = `<span class="lbl">Dicionário</span><p><b>${g[0]}:</b> ${g[1]}</p>`;
}
function openBag(){
  $('#bag-list').innerHTML = REP_ORDER.map(r => {
    if(S.rep[r]) return repCard(r);
    const fi = FASES.findIndex(f => (f.unlock || []).includes(r));
    return `<div class="rep locked"><span class="eyebrow">Carta bloqueada</span><b>???</b><span>Conclua a Fase ${fi+1} para ganhar esta carta.</span></div>`;
  }).join('');
  $('#bag').hidden = false;
  $('#bag-close').focus();
}
function closeBag(){ $('#bag').hidden = true; }

const GUARD = new Set(['next','back','causa','opt','con','ans','abertura','prop','open','home','entrar','sair']);
let lastTap = 0, lastAct = '';
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(GUARD.has(a)){ const t = Date.now(); if(a === lastAct && t - lastTap < 450) return; lastTap = t; lastAct = a; }
  switch(a){
    case 'entrar': entrar(); break;
    case 'sair': sair(false); break;
    case 'sair-forcar': sair(true); break;
    case 'open': openTarget(b.dataset.f); break;
    case 'home': closeBag(); S.screen = 'home'; go(); break;
    case 'next': next(); break;
    case 'back': back(); break;
    case 'ans': answer(b.dataset.q, +b.dataset.k); break;
    case 'causa': toggleCausa(b.dataset.c); break;
    case 'abertura': if(S.abertura !== b.dataset.a){ S.abertura = b.dataset.a; delete S.m.intro_ponte; } render(); break;
    case 'con': pickCon(+b.dataset.k); break;
    case 'opt': pickOpt(+b.dataset.k); break;
    case 'prop': { const g = b.dataset.g, k = +b.dataset.k; S.prop[g] = k; render(); if(k === -1){ const i = $('#pc-' + g); if(i) i.focus(); } break; }
    case 'gloss': showGloss(b); break;
    case 'easy': S.easy = b.dataset.v === '1'; render(); break;
    case 'speak': { const el = document.getElementById(b.dataset.t); if(el) speakText(b, el.innerText); break; }
    case 'speak-folha': speakText(b, S.paras.filter(Boolean).join(' ')); break;
    case 'bag': openBag(); break;
    case 'bag-close': closeBag(); break;
    case 'copy': copyAll(); break;
    case 'reset': { const r = $('#resetbox'); r.hidden = false; r.scrollIntoView({block:'center'}); break; }
    case 'reset-no': $('#resetbox').hidden = true; break;
    case 'reset-yes': S = merge(null); if(SESS){ S.nome = SESS.nome; S.turma = SESS.turma; } S.screen = 'home'; go(); syncNow(); toast('Tudo apagado. Pode começar de novo!'); break;
    case 'rev': S.rev[b.dataset.r] = !S.rev[b.dataset.r]; refreshChecks(); save(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset || {};
  if(d.mc){ mOf(d.mc).txt = t.value; const c = $('#cur'); if(c) c.textContent = blockText(d.mc) || '…'; updateAviso(t.value); updateBar(); saveSoon(); }
  else if(d.lf){ LF[d.lf] = t.value; }
  else if(d.pc){ S.prop['c_' + d.pc] = t.value; const pv = $('#prop-prev'); if(pv) pv.innerHTML = propPreviewHTML(); updateBar(); saveSoon(); }
  else if(d.folha != null){ S.paras[+d.folha] = t.value; S.edited[+d.folha] = true; grow(t); refreshChecks(); saveSoon(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('#bag').hidden) closeBag();
  if(e.key === 'Enter' && e.target && e.target.closest && e.target.closest('#in-nome, #in-turma, #in-pin')){ e.preventDefault(); entrar(); }
});
document.addEventListener('visibilitychange', () => { if(document.hidden){ clearTimeout(saveT); save(); flushBeacon(); } else if(SESS) refreshFromServer(); });
window.addEventListener('pagehide', () => { clearTimeout(saveT); save(); flushBeacon(); });
window.addEventListener('online', () => { if(SESS) syncNow(); });
window.addEventListener('offline', () => setSync());
$('#bag').addEventListener('click', e => { if(e.target.id === 'bag') closeBag(); });
window.addEventListener('resize', () => { setBarH(); document.querySelectorAll('textarea[data-folha]').forEach(grow); });

/* ---------- início ---------- */
if(SESS && !cacheMeta.pendente) lastSent = JSON.stringify(snapshot());
render();
if(SESS) refreshFromServer();
})();
</script>
